# Auto-provisions Prometheus as a Grafana datasource on container startup.
# Grafana loads every *.yml file under provisioning/datasources/ automatically.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s

# nginx-bluegreen.conf
#
# Reference nginx config for the blue/green deploy demo driven by
# blue_green_demo.sh in this same directory. This file is a template:
# blue_green_demo.sh copies it into a scratch run directory and substitutes
# __RUNDIR__ (a writable temp dir for logs/pid/temp-file paths) and
# __ACTIVE_PORT__ (9101 for v1/blue, 9102 for v2/green) before starting
# nginx with it. You can also just run it as-is if you create the
# directories it references and pass literal values for those two
# placeholders yourself.
#
# THE ACTUAL BLUE/GREEN MECHANISM IS ONE LINE: the `server` directive
# inside the `upstream backend { ... }` block below. Flipping traffic from
# v1 to v2 means rewriting that one line to point at the other port and
# running `nginx -s reload` - reload re-reads config and swaps upstream
# connections for NEW requests without dropping requests already in
# flight, which is what makes this "zero dropped requests" rather than a
# hard cutover.

worker_processes 1;
error_log __RUNDIR__/logs/error.log;
pid __RUNDIR__/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log __RUNDIR__/logs/access.log;

    # nginx needs writable temp-file paths; pointing these at our own
    # scratch run dir means this config never touches system nginx paths
    # and can run fully unprivileged.
    client_body_temp_path __RUNDIR__/tmp/client_body;
    proxy_temp_path       __RUNDIR__/tmp/proxy;
    fastcgi_temp_path     __RUNDIR__/tmp/fastcgi;
    uwsgi_temp_path       __RUNDIR__/tmp/uwsgi;
    scgi_temp_path        __RUNDIR__/tmp/scgi;

    upstream backend {
        # <<< THIS LINE IS THE BLUE/GREEN SWITCH >>>
        # 9101 = v1 (blue), 9102 = v2 (green). blue_green_demo.sh rewrites
        # this port and reloads nginx to flip live traffic.
        server 127.0.0.1:__ACTIVE_PORT__;
    }

    server {
        listen 8088;

        location /health {
            return 200 "nginx-bluegreen ok\n";
        }

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            # Don't let nginx silently retry a failed request against a
            # different upstream during a flip - we want to actually see
            # a dropped request in our test if the flip isn't clean.
            proxy_next_upstream off;
        }
    }
}
